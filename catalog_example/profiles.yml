# Example profile catalog
version: "1.0"

profiles:
  - id: edc
    label: Data Center
    description: On-premise data center with physical and virtual servers.
    icon: corporate_fare
    color: blue
    allowed_server_types: [physical, vm]
    ram_steps_gb: [32, 64, 128, 256, 512, 1024, 2048]
    socket_options: [1, 2, 4]
    ram_manual_max_gb: 8192
    disk_count_options: [1, 2, 4, 6, 8]
    vm_disk_size_steps_gb: [10, 20, 50, 100, 200, 500, 1000, 2000]
    storage_manual_max_gb: 131072
    features:
      - id: multi_storage
        label: Multiple Storage Products
        icon: device_hub
        available: true
    rules:
      - id: edc_max_storage_lines
        type: storage_count_limit
        applies_to_types: [physical]
        max_count: 8
        severity: error

  - id: fce
    label: Internal Cloud
    description: Managed virtual environment with VM and container workloads.
    icon: cloud_queue
    color: cyan
    allowed_server_types: [vm, container]
    ram_steps_gb: [2, 4, 8, 16, 32, 64, 128, 256, 512]
    vcpu_tiles: [1, 2, 4, 8, 16, 32, 64]
    ram_manual_max_gb: 4096
    disk_count_options: [1, 2, 4, 6, 8]
    vm_disk_size_steps_gb: [10, 20, 50, 100, 200, 500, 1000, 2000]
    storage_manual_max_gb: 131072
    features:
      - id: multi_storage
        label: Multiple Storage Products
        icon: device_hub
        available: false
    rules:
      - id: fce_single_storage
        type: storage_count_limit
        applies_to_types: [vm, container]
        max_count: 1
        severity: error
