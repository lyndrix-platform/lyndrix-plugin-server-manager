# Example global settings catalog
version: "1.0"

server_statuses:
  - id: active
    label: "Active"
    color: emerald
    terminal: false
  - id: ordered
    label: "Ordered"
    color: sky
    terminal: false
  - id: provisioning
    label: "Provisioning"
    color: amber
    terminal: false
  - id: decommissioned
    label: "Decommissioned"
